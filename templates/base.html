<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>{% block title %}AgroMec{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body>{% if session.user_id %}<header class="topbar"><a class="brand" href="/"><span class="brand-mark">🌾</span><span>AgroMec<small>Fleet Maintenance</small></span></a><button class="menu-btn" type="button" aria-label="Abrir menu">☰</button><nav class="nav"><a href="/">Dashboard</a><a href="/maquinas">Máquinas</a><a href="/mecanicos">Mecânicos</a><a href="/pecas">Estoque</a><a href="/os">Ordens de serviço</a><a href="/relatorio">Relatórios</a><a href="/busca">Busca</a></nav><div class="user-menu"><span class="user-name">{{session.nome}}</span><span class="avatar">{{session.nome[0]}}</span><a href="/logout" title="Sair">↪</a></div></header>{% endif %}<main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="/static/app.js"></script></body></html>
